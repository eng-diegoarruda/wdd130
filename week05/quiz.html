<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 130 | Basic HTML and CSS Quiz</title>
    <meta name="description" content="Online quiz form testing basic HTML and CSS knowledge for WDD 130.">
    <meta name="author" content="Diego Maia Arruda">
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main>
        <h1>Basic HTML and CSS Quiz</h1>
        <form>
            <div class="form-item">
                <label for="q1">1. What does the acronym CSS stand for?</label>
                <input type="text" id="q1" name="q1" required>
            </div>

            <div class="form-item">
                <label for="q2">2. How are id and class attributes selected in CSS?</label>
                <textarea id="q2" name="q2" rows="4" required></textarea>
            </div>

            <div class="form-item">
                <label for="q3">3. Which of the following is a valid CSS comment?</label>
                <select id="q3" name="q3" required>
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="slash">/* This is a CSS comment */</option>
                    <option value="html">&lt;!-- This is a CSS comment --&gt;</option>
                    <option value="double">// This is a CSS comment</option>
                </select>
            </div>

            <div class="form-item">
                <label for="q4">4. What is the bottom margin given this declaration? <code>margin: 10px 5px 15px;</code></label>
                <input type="number" id="q4" name="q4" required>
            </div>

            <button type="submit">Submit Quiz</button>
        </form>
    </main>
</body>

</html>
