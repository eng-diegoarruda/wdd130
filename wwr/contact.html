<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting Co.</title>
    <meta name="description" content="Contact White Water Rafting Co. for trip reservations, general inquiries, directions, and customer support.">
    <meta name="author" content="Diego Maia Arruda">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpeg" alt="Rafting Company Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="contact-header">
            <h1>White Water Rafting Co.</h1>
            <p>123 River Rapids Road<br>
                Moab, Utah 84532<br>
                +1 (435) 555-0194<br>
                info@whitewaterraftingco.com</p>
        </section>

        <section class="contact-grid">
            <div class="map-container">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d49825.92556862171!2d-109.59134572191158!3d38.57331546326829!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8747e1e59ab82d8d%3A0xb32b17af1d5c42d!2sMoab%2C%20UT%2084532%2C%20USA!5e0!3m2!1sen!2sbr!4v1700000000000!5m2!1sen!2sbr"
                    allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
                    title="White Water Rafting Co. Location Map"></iframe>
            </div>

            <form class="contact-form">
                <div class="form-row">
                    <label for="username">Name</label>
                    <input type="text" id="username" name="username" placeholder="Your Full Name" required>
                </div>

                <div class="form-row">
                    <label for="useremail">Email</label>
                    <input type="email" id="useremail" name="useremail" placeholder="you@example.com" required>
                </div>

                <fieldset class="radio-group">
                    <legend>Message Purpose</legend>
                    <div class="radio-options">
                        <label for="purpose-general">
                            <input type="radio" id="purpose-general" name="purpose" value="general" required>
                            General Inquiry
                        </label>
                        <label for="purpose-reservation">
                            <input type="radio" id="purpose-reservation" name="purpose" value="reservation">
                            Reservation Question
                        </label>
                        <label for="purpose-suggestion">
                            <input type="radio" id="purpose-suggestion" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                    </div>
                </fieldset>

                <div class="form-column">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Type your message here..." required></textarea>
                </div>

                <div class="checkbox-row">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit">Send Message</button>
            </form>
        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="images/employee1.jpg" alt="Sarah Jenkins, Lead River Guide">
                <figcaption>Sarah Jenkins — Lead River Guide</figcaption>
            </figure>
            <figure>
                <img src="images/employee2.jpg" alt="Marcus Vance, Safety &amp; Operations Director">
                <figcaption>Marcus Vance — Safety &amp; Operations Director</figcaption>
            </figure>
            <figure>
                <img src="images/employee3.jpg" alt="Lucas Rivera, Trip Coordinator">
                <figcaption>Lucas Rivera — Trip Coordinator</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 | White Water Rafting Co. | Diego Maia Arruda</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank" rel="noopener">
                <img src="images/facebook.svg" alt="Facebook">
            </a>
            <a href="https://linkedin.com" target="_blank" rel="noopener">
                <img src="images/linkedin.svg" alt="LinkedIn">
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener">
                <img src="images/instagram.svg" alt="Instagram">
            </a>
        </nav>
    </footer>
</body>

</html>
